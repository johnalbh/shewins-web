# Checks every push to main and every pull request: formatting, lint, types, unit tests and the
# build. Commits saved from the Keystatic panel skip the local pre-commit hook, so this is where
# their content is checked too (the build fails on invalid content).
# The licensed brand font is not available here; the build warns and goes on without it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
